# Reusable workflow: post a PR notification to a Microsoft Teams webhook.
# Host this in one central repo (e.g. <org>/.github) and call it from every project.
# Teams side: channel/chat -> Workflows -> "Post to a channel/chat when a webhook request is received".
name: Teams PR notify (reusable)

on:
  workflow_call:
    inputs:
      base_branches:
        description: 'JSON array of target branches to notify for'
        type: string
        default: '["develop"]'
      title_prefix:
        description: 'Text shown before the PR title (e.g. project name)'
        type: string
        default: ''
      mention_text:
        description: 'Optional extra line in the card (e.g. "@reviewers")'
        type: string
        default: ''
    secrets:
      TEAMS_WEBHOOK_URL:
        required: true

jobs:
  notify:
    runs-on: ubuntu-latest
    if: contains(fromJSON(inputs.base_branches), github.base_ref)
    steps:
      - name: Send Teams card
        env:
          WEBHOOK: ${{ secrets.TEAMS_WEBHOOK_URL }}
          # Passed via env, never inlined in the script: PR titles are untrusted input.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_BASE: ${{ github.base_ref }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          REPO: ${{ github.repository }}
          PREFIX: ${{ inputs.title_prefix }}
          EXTRA: ${{ inputs.mention_text }}
        run: |
          [ "$PR_DRAFT" = "true" ] && { echo "draft PR, skip"; exit 0; }
          payload=$(jq -n \
            --arg title "${PREFIX:+$PREFIX · }PR #$PR_NUM: $PR_TITLE" \
            --arg body "**$PR_AUTHOR** wants to merge \`$PR_HEAD\` → \`$PR_BASE\` in **$REPO**" \
            --arg extra "$EXTRA" --arg url "$PR_URL" '
            {type:"message", attachments:[{
              contentType:"application/vnd.microsoft.card.adaptive", contentUrl:null,
              content:{
                "$schema":"http://adaptivecards.io/schemas/adaptive-card.json",
                type:"AdaptiveCard", version:"1.4",
                body:([
                  {type:"TextBlock", size:"Medium", weight:"Bolder", wrap:true, text:$title},
                  {type:"TextBlock", wrap:true, text:$body}
                ] + (if $extra == "" then [] else [{type:"TextBlock", wrap:true, text:$extra}] end)),
                actions:[{type:"Action.OpenUrl", title:"Review PR", url:$url}]
              }}]}')
          curl -fsS --retry 3 -X POST -H 'Content-Type: application/json' -d "$payload" "$WEBHOOK"
